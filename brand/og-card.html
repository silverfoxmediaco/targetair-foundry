<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Target Air — share card</title>
    <style>
      /* Source for the 1280x640 social share card.
         Rendered to PNG by brand/render-og.mjs. Edit here, re-run that, never
         hand-edit the PNG — the whole point is that it stays reproducible. */

      @font-face {
        font-family: "Poppins";
        src: url("../dashboard/node_modules/@fontsource/poppins/files/poppins-latin-300-normal.woff2")
          format("woff2");
        font-weight: 300;
      }
      @font-face {
        font-family: "Poppins";
        src: url("../dashboard/node_modules/@fontsource/poppins/files/poppins-latin-600-normal.woff2")
          format("woff2");
        font-weight: 600;
      }
      @font-face {
        font-family: "IBM Plex Sans";
        src: url("../dashboard/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2")
          format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "IBM Plex Mono";
        src: url("../dashboard/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2")
          format("woff2");
        font-weight: 400;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 1280px;
        height: 640px;
      }

      body {
        position: relative;
        overflow: hidden;
        background: #080d12;
        /* Same light-from-upper-left as the sign-in screen, so the card and the
           product read as one thing. */
        background-image: radial-gradient(
          900px 620px at 14% -12%,
          rgba(90, 179, 209, 0.2),
          transparent 68%
        );
        color: #ffffff;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 96px;
      }

      /* Oversized mark bled off the right edge — the same surface treatment the
         sign-in screen uses, scaled for the card. */
      .watermark {
        position: absolute;
        right: -150px;
        bottom: -190px;
        width: 760px;
        height: 760px;
        color: #5ab3d1;
        opacity: 0.05;
      }

      .lockup {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-bottom: 54px;
      }

      .mark {
        width: 62px;
        height: 62px;
        color: #5ab3d1;
        flex: none;
        display: block;
      }

      .wordmark {
        display: flex;
        align-items: baseline;
        font-family: "Poppins", sans-serif;
        font-size: 52px;
        letter-spacing: 0.14em;
        line-height: 1;
      }

      /* The weight contrast is the lockup. */
      .t1 {
        font-weight: 300;
      }
      .t2 {
        font-weight: 600;
        margin-left: 0.14em;
      }

      .slogan {
        font-family: "Poppins", sans-serif;
        font-weight: 600;
        font-size: 58px;
        line-height: 1.1;
        letter-spacing: -0.02em;
        max-width: 20ch;
        margin-bottom: 26px;
      }

      .sub {
        font-size: 23px;
        line-height: 1.55;
        color: #dbe6f0;
        max-width: 46ch;
      }

      .rule {
        width: 96px;
        height: 2px;
        background: #5ab3d1;
        margin: 0 0 34px;
      }

      .foot {
        position: absolute;
        left: 96px;
        right: 96px;
        bottom: 54px;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-family: "IBM Plex Mono", monospace;
        font-size: 17px;
        letter-spacing: 0.06em;
        color: #b6c6d4;
      }

      .foot .dim {
        color: #5ab3d1;
      }
    </style>
  </head>
  <body>
    <svg class="watermark" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M16 2 L30 28 L16 20.5 L2 28 Z" fill="currentColor" />
    </svg>

    <div class="lockup">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 2 L30 28 L16 20.5 L2 28 Z" fill="currentColor" />
      </svg>
      <span class="wordmark"><span class="t1">TARGET</span><span class="t2">AIR</span></span>
    </div>

    <div class="rule"></div>

    <!-- No slogan. This is the card for an internal system, so it says whose
         system it is and what it covers — the same thing the sign-in screen
         says. A hook would read as a product being sold rather than a tool
         being used. -->
    <h1 class="slogan">Program Operations</h1>
    <p class="sub">
      Where the TA-7 program stands today: which airframes are behind, what is holding the line,
      and what it costs the delivery schedule.
    </p>

    <div class="foot">
      <span>TA-7 PROGRAM · TARGET AIR LIMITED</span>
      <span class="dim">PALANTIR FOUNDRY · ONTOLOGY SDK</span>
    </div>
  </body>
</html>
