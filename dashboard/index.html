<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- The mark is a single filled path, so the SVG is sharp at any size and
         needs no .ico. The 32px PNG is a fallback for browsers that still do
         not take an SVG favicon. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#080d12" />

    <meta
      name="description"
      content="Target Air Limited programme operations. Delivery schedule, line constraint, shortages and supplier exposure for the TA-7 unmanned aircraft program."
    />

    <!-- Read by src/client.ts at runtime. Vite substitutes these from the
         matching .env file at build time, which is why the deployed redirect
         URL has to be set before the production build rather than after. -->
    <meta name="osdk-clientId" content="%VITE_FOUNDRY_CLIENT_ID%" />
    <meta name="osdk-redirectUrl" content="%VITE_FOUNDRY_REDIRECT_URL%" />
    <meta name="osdk-foundryUrl" content="%VITE_FOUNDRY_API_URL%" />
    <meta name="osdk-ontologyRid" content="%VITE_FOUNDRY_ONTOLOGY_RID%" />

    <title>Target Air · Program Operations</title>
  </head>
  <body>
    <div id="root-container">
      <div id="root"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
